<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UrbanoFlashCar</title>
    <meta name="description" content="Plataforma própria de corridas urbanas." />

    <!-- PWA: installable on desktop and mobile across operating systems -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1419" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="UrbanoFlashCar" />

    <!-- Mapa gratuito e sem chave: Leaflet + OpenStreetMap -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
      crossorigin=""
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"
      crossorigin=""
    ></script>

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="/icons/icon-192.png" alt="" width="28" height="28" />
        <span>UrbanoFlashCar</span>
      </div>
      <div class="topbar-actions">
        <button id="install-btn" type="button" class="btn btn-ghost" hidden>Instalar app</button>
        <div id="session-box" class="session-box" hidden>
          <span id="session-user" class="session-user"></span>
          <button id="logout-btn" type="button" class="btn btn-ghost">Sair</button>
        </div>
      </div>
    </header>

    <main id="main" class="container">
      <!-- Auth view -->
      <section id="auth-view" class="card auth" aria-labelledby="auth-title">
        <div class="tabs" role="tablist" aria-label="Entrar ou cadastrar">
          <button id="tab-login" class="tab is-active" role="tab" aria-selected="true">Entrar</button>
          <button id="tab-register" class="tab" role="tab" aria-selected="false">Criar conta</button>
        </div>

        <form id="login-form" class="form" novalidate>
          <h1 id="auth-title" class="form-title">Entrar</h1>
          <label>E-mail<input type="email" name="email" autocomplete="email" required /></label>
          <label>Senha<input type="password" name="password" autocomplete="current-password" required /></label>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>

        <form id="register-form" class="form" hidden novalidate>
          <h1 class="form-title">Criar conta</h1>
          <label>Nome<input type="text" name="name" autocomplete="name" required minlength="2" /></label>
          <label>E-mail<input type="email" name="email" autocomplete="email" required /></label>
          <label>Senha (mín. 8)<input type="password" name="password" autocomplete="new-password" required minlength="8" /></label>
          <fieldset class="roles">
            <legend>Perfil</legend>
            <label class="radio"><input type="radio" name="role" value="rider" checked /> Passageiro</label>
            <label class="radio"><input type="radio" name="role" value="driver" /> Motorista</label>
          </fieldset>
          <button type="submit" class="btn btn-primary">Cadastrar</button>
        </form>
      </section>

      <!-- Rider view -->
      <section id="rider-view" hidden>
        <!-- Tela inicial: rotas favoritas + corridas -->
        <div id="rider-home" class="grid">
          <div class="card">
            <div class="list-head">
              <h2>Rotas favoritas</h2>
              <button id="new-ride-btn" type="button" class="btn btn-primary btn-sm">+ Nova corrida</button>
            </div>
            <ul id="favorites-list" class="rides" aria-live="polite"></ul>
          </div>
          <div class="card">
            <div class="list-head">
              <h2>Minhas corridas</h2>
              <button id="refresh-rides" type="button" class="btn btn-ghost">Atualizar</button>
            </div>
            <ul id="rides-list" class="rides" aria-live="polite"></ul>
          </div>
        </div>

        <!-- Tela: escolher origem/destino e procurar motorista próximo -->
        <div id="rider-newride" class="card" hidden>
          <div class="list-head">
            <h2>Origem, destino e motorista</h2>
            <button id="back-home-btn" type="button" class="btn btn-ghost btn-sm">← Voltar</button>
          </div>
          <form id="ride-form" class="form maps-off" novalidate>
            <!-- Mapa real gratuito (Leaflet + OpenStreetMap) -->
            <div id="map" class="map" aria-label="Mapa" role="application"></div>

            <!-- Busca de endereços reais (Photon / OpenStreetMap) -->
            <div class="maps-inputs">
              <label>Origem
                <input type="text" id="pickup-search" class="addr" placeholder="Buscar endereço de origem" autocomplete="off" />
              </label>
              <button type="button" id="geoloc-btn" class="btn btn-ghost btn-sm">📍 Usar minha localização</button>
              <label>Destino
                <input type="text" id="dropoff-search" class="addr" placeholder="Buscar endereço de destino" autocomplete="off" />
              </label>
            </div>

            <!-- Fallback (offline): presets + coordenadas. Também armazena os
                 valores usados ao solicitar. -->
            <div class="manual-inputs">
              <div class="place">
                <label>Origem
                  <select name="pickup-preset" class="preset" data-target="pickup"></select>
                </label>
                <div class="coords">
                  <input type="text" name="pickup-label" placeholder="Nome do local" />
                  <input type="number" step="any" name="pickup-lat" placeholder="lat" />
                  <input type="number" step="any" name="pickup-lng" placeholder="lng" />
                </div>
              </div>
              <div class="place">
                <label>Destino
                  <select name="dropoff-preset" class="preset" data-target="dropoff"></select>
                </label>
                <div class="coords">
                  <input type="text" name="dropoff-label" placeholder="Nome do local" />
                  <input type="number" step="any" name="dropoff-lat" placeholder="lat" />
                  <input type="number" step="any" name="dropoff-lng" placeholder="lng" />
                </div>
              </div>
            </div>

            <div class="actions">
              <button type="button" id="estimate-btn" class="btn btn-ghost">Estimar</button>
              <button type="button" id="find-drivers-btn" class="btn btn-ghost">Motoristas próximos</button>
              <button type="button" id="save-fav-btn" class="btn btn-ghost">★ Salvar favorita</button>
              <button type="submit" class="btn btn-primary">Solicitar</button>
            </div>
          </form>
          <div id="estimate-box" class="estimate" hidden aria-live="polite"></div>
          <div id="nearby-box" class="nearby" hidden aria-live="polite"></div>
        </div>
      </section>

      <!-- Driver view -->
      <section id="driver-view" hidden>
        <div class="card availability">
          <div class="list-head">
            <h2>Disponibilidade</h2>
            <button id="online-toggle" type="button" class="btn btn-primary btn-sm">Ficar online</button>
          </div>
          <div id="online-status" class="meta">Offline — compartilhe sua localização para aparecer aos passageiros.</div>
        </div>
        <div class="grid">
          <div class="card">
            <div class="list-head">
              <h2>Corridas disponíveis</h2>
              <button id="refresh-available" type="button" class="btn btn-ghost">Atualizar</button>
            </div>
            <ul id="available-list" class="rides" aria-live="polite"></ul>
          </div>
          <div class="card">
            <div class="list-head">
              <h2>Minhas corridas</h2>
              <button id="refresh-driver-rides" type="button" class="btn btn-ghost">Atualizar</button>
            </div>
            <ul id="driver-rides-list" class="rides" aria-live="polite"></ul>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>UrbanoFlashCar</span>
      <span id="app-version" class="app-version" title="Versão da plataforma (atualiza automaticamente)"></span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="assertive" hidden></div>
    <script src="/app.js" type="module"></script>
  </body>
</html>
